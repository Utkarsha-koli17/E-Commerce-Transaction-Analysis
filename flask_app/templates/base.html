<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - E-Commerce Analytics</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Navigation */
        .nav {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .nav-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            text-decoration: none;
            color: #333;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #667eea;
            color: white;
        }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { font-size: 2.2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        
        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #667eea; font-size: 0.85em; text-transform: uppercase; margin-bottom: 10px; }
        .card .value { font-size: 2em; font-weight: bold; color: #333; }
        .card .label { color: #999; font-size: 0.85em; margin-top: 5px; }
        
        /* Charts */
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .chart-box.full { grid-column: 1 / -1; }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <div class="nav-brand">🛒 E-Commerce Analytics</div>
            <div class="nav-links">
                <a href="/" {% if active == 'overview' %}class="active"{% endif %}>Overview</a>
                <a href="/categories" {% if active == 'categories' %}class="active"{% endif %}>Categories</a>
                <a href="/geography" {% if active == 'geography' %}class="active"{% endif %}>Geography</a>
                <a href="/payments" {% if active == 'payments' %}class="active"{% endif %}>Payments</a>
                <a href="/trends" {% if active == 'trends' %}class="active"{% endif %}>Trends</a>
                <a href="/customers" {% if active == 'customers' %}class="active"{% endif %}>Customers</a>
            </div>
        </nav>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
